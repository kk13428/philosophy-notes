      "body_html": "<h1>费希特 vs 康德：从先验统觉到绝对自我</h1>\n<h2>核心张力</h2>\n<p>费希特和康德的关系是哲学史上最微妙的\"继承即背叛\"案例之一。</p>\n<p>康德死后，费希特写了一篇著名的文章叫《论我们信仰一个神圣世界统治者的根据》——这篇文章直接导致了一个指控：<strong>无神论</strong>。费希特被赶出耶拿大学。这个事件不是偶然的——它暴露了康德和费希特之间的一条裂隙：康德需要上帝（作为至善的条件），费希特说：不需要——自我本身就够了。</p>\n<p>这个裂隙不是突然出现的——它根植于两人对\"自我\"的根本不同理解。</p>\n<h2>分歧一：物自体——要不要留着它？</h2>\n<p>这是最表面的分歧，但也是最重要的分歧。</p>\n<p>康德说：物自体是知识无法跨越的边界。你永远不知道事物本身——只知道它向你呈现的样子。这个边界对康德来说是建设性的——它让理性安分守己，在经验领域安心工作。</p>\n<p>费希特说：<strong>这个概念是多余的。</strong></p>\n<p>如果物自体不可知——那我怎么知道它在\"刺激\"我的感官？说\"物自体刺激我们\"本身就是一个关于物自体的知识。康德非法地使用了一个他声称不可用的概念。</p>\n<p>费希特的替代方案：那个\"被刺激\"的感觉——不是来自外部——是自我的自我限制。是自我设定了\"非我\"来限制自己的活动。这就像一个人自己画了一个圈，然后挑战自己跳出去。</p>\n<p><strong>这意味着：整个经验世界——包括\"被外部刺激\"的感觉——都可以从自我的活动中被推导出来。</strong> 不需要物自体。</p>\n<p>但这里有一个问题：费希特的\"非我\"真的比康德的\"物自体\"更不神秘吗？黑格尔后来会问：这个\"非我\"是什么？它是从哪里来的？如果它也是自我设定的——那它为什么会对自我构成\"抵抗\"？</p>\n<h2>分歧二：自我的本质——空的逻辑条件 vs 无限行动</h2>\n<p>康德的\"先验统觉\"——那个\"我思必须能伴随我的一切表象\"——是经验的逻辑条件。它本身是空的，没有内容，不是经验对象，只是一个形式条件。</p>\n<p>费希特说：这个自我太\"安静\"了。它像是一个被动收看世界节目的人——只是确保各个频道不串台。</p>\n<p>费希特的自我是<strong>生产性的</strong>：</p>\n<ul><ol><li>康德的统觉：统合已有的表象</li>\n<li>费希特的自我：<strong>产生表象的活动本身</strong></li>\n</ol></ul>\n这个区别直接决定了两个人对\"主体性\"的理解不同：\n<p>| 维度 | 康德 | 费希特 |<br>|------|------|--------|<br>| 自我的角色 | 经验的统一条件 | 一切意识的生产者 |<br>| 自我有没有内容 | 空的，形式的 | 动态的，行动的 |<br>| 自我的起源 | 逻辑上必要 | 原始的行动（Tathandlung） |<br>| 自我与世界的关系 | 世界通过自我的结构被认识 | 世界是自我的产物 |</p>\n<h2>分歧三：自由——道德的条件 vs 存在的形式</h2>\n<p>康德：自由是预设的。你体验道德律——所以你<strong>必须假设</strong>自己是自由的。证明不了——但如果你要理解\"应该\"，你必须假设\"能够\"。</p>\n<p>费希特：自由不是假设——<strong>自由是起点。</strong> 在你做任何道德决定之前——在你思考之前——自我设定自身的那个原始行动就是自由。你不是\"拥有\"自由——你就是自由。</p>\n<p>这个区别的后果：</p>\n<ul><ol><li>康德的自律是<strong>道德的自律</strong>——你服从自己立的理性法则</li>\n<li>费希特的自律是<strong>存在的自律</strong>——你通过行动不断创造自己</li>\n</ol></ul>\n前者是说：在道德领域，你是自己的立法者。后者是说：在一切领域——包括对世界<strong>知识</strong>——你都是构成者。\n<h2>分歧四：体系——分析条件 vs 演绎体系</h2>\n<p>康德：先验哲学是\"条件分析\"——问\"经验如何可能\"，往回找到条件。这是一套回溯式的论证——不是从一个点出发的演绎。</p>\n<p>费希特：真正的科学（学问=Wissenschaft）必须从一个<strong>自明的第一原理</strong>出发，然后<strong>演绎</strong>出一切。费希特的知识学就是一个从\"自我设定自身\"出发的完整演绎。</p>\n<p>这意味着费希特比康德更\"系统化\"——但也更冒险。康德说\"我们只能分析出来这些条件\"，费希特说\"这些条件可以从一个原点推导出来\"。如果费希特是对的——哲学就是一门严格的、像几何学一样的演绎科学。如果他错了——整个体系可能只是一个漂亮的空中楼阁。</p>\n<h2>连接：两人共享的根本洞见</h2>\n<p>尽管有上述分歧——两人共享一个更根本的立场，这个立场把他们和所有后来的哲学家（特别是经验主义和后现代主义）区分开：</p>\n<p><strong>主体不是被动接收世界的——主体是主动构成世界的。</strong></p>\n<p>不管是康德的\"先验条件\"还是费希特的\"自我设定\"——都承认一个核心观点：你看到的世界不是\"本来的样子\"——是你<strong>参与构成</strong>的样子。</p>\n<p>这条红线从康德→费希特→黑格尔→胡塞尔→海德格尔→萨特——是欧陆哲学中最坚实的基础之一。</p>\n<h2>后续问题</h2>\n<ol><li><strong>费希特 vs 萨特</strong>：今天的概念笔记里说了费希特和萨特的相似性——但有一个关键的差异值得深入：费希特的\"非我\"是自我的一部分，是内在的张力。萨特的\"他者\"是外来的，是从外部分裂我。这种从\"内部冲突\"到\"外部冲突\"的转换——反映了什么？</li>\n</ol>\n<ol><li><strong>费希特的\"自我\"到底是哲学概念还是神学概念？</strong> 费希特被指控无神论——但读他的后期作品，他的\"绝对自我\"越来越接近一种哲学化的上帝。他到底在说\"人就是终极实在\"还是\"人的活动中体现了终极实在\"？这个模糊对后来的浪漫主义影响深远。</li>\n</ol>\n<ol><li><strong>如果费希特是对的，为什么康德没有走这条路？</strong> 这可能不是一个\"康德胆子小\"的问题——康德可能看到了费希特没看到的风险：如果一切从自我出发——那你如何解释<strong>信念</strong>的多样性？如果自我是一样的，为什么不同文化的人看到的世界如此不同？康德有物自体作为\"不可知的储备\"——费希特一旦取消这个储备，就不得不面对这个问题。</li>\n</ol>\n<h2>相关链接</h2>\n<ul><ol><li>[[康德]]</li>\n<li>[[费希特]]</li>\n<li>[[黑格尔]] — 对费希特\"非我\"概念的批判</li>\n<li>[[萨特]] — 费希特式自我的存在主义版本</li>\n<li>[[现象与物自体]] — 物自体争论的焦点</li>\n<li>[[德国观念论]]</li>\n<li>[[自由与道德]]</li></ol></ul>",
      "body_md": "# 费希特 vs 康德：从先验统觉到绝对自我\n\n## 核心张力\n\n费希特和康德的关系是哲学史上最微妙的\"继承即背叛\"案例之一。\n\n康德死后，费希特写了一篇著名的文章叫《论我们信仰一个神圣世界统治者的根据》——这篇文章直接导致了一个指控：**无神论**。费希特被赶出耶拿大学。这个事件不是偶然的——它暴露了康德和费希特之间的一条裂隙：康德需要上帝（作为至善的条件），费希特说：不需要——自我本身就够了。\n\n这个裂隙不是突然出现的——它根植于两人对\"自我\"的根本不同理解。\n\n## 分歧一：物自体——要不要留着它？\n\n这是最表面的分歧，但也是最重要的分歧。\n\n康德说：物自体是知识无法跨越的边界。你永远不知道事物本身——只知道它向你呈现的样子。这个边界对康德来说是建设性的——它让理性安分守己，在经验领域安心工作。\n\n费希特说：**这个概念是多余的。**\n\n如果物自体不可知——那我怎么知道它在\"刺激\"我的感官？说\"物自体刺激我们\"本身就是一个关于物自体的知识。康德非法地使用了一个他声称不可用的概念。\n\n费希特的替代方案：那个\"被刺激\"的感觉——不是来自外部——是自我的自我限制。是自我设定了\"非我\"来限制自己的活动。这就像一个人自己画了一个圈，然后挑战自己跳出去。\n\n**这意味着：整个经验世界——包括\"被外部刺激\"的感觉——都可以从自我的活动中被推导出来。** 不需要物自体。\n\n但这里有一个问题：费希特的\"非我\"真的比康德的\"物自体\"更不神秘吗？黑格尔后来会问：这个\"非我\"是什么？它是从哪里来的？如果它也是自我设定的——那它为什么会对自我构成\"抵抗\"？\n\n## 分歧二：自我的本质——空的逻辑条件 vs 无限行动\n\n康德的\"先验统觉\"——那个\"我思必须能伴随我的一切表象\"——是经验的逻辑条件。它本身是空的，没有内容，不是经验对象，只是一个形式条件。\n\n费希特说：这个自我太\"安静\"了。它像是一个被动收看世界节目的人——只是确保各个频道不串台。\n\n费希特的自我是**生产性的**：\n\n- 康德的统觉：统合已有的表象\n- 费希特的自我：**产生表象的活动本身**\n\n这个区别直接决定了两个人对\"主体性\"的理解不同：\n\n| 维度 | 康德 | 费希特 |\n|------|------|--------|\n| 自我的角色 | 经验的统一条件 | 一切意识的生产者 |\n| 自我有没有内容 | 空的，形式的 | 动态的，行动的 |\n| 自我的起源 | 逻辑上必要 | 原始的行动（Tathandlung） |\n| 自我与世界的关系 | 世界通过自我的结构被认识 | 世界是自我的产物 |\n\n## 分歧三：自由——道德的条件 vs 存在的形式\n\n康德：自由是预设的。你体验道德律——所以你**必须假设**自己是自由的。证明不了——但如果你要理解\"应该\"，你必须假设\"能够\"。\n\n费希特：自由不是假设——**自由是起点。** 在你做任何道德决定之前——在你思考之前——自我设定自身的那个原始行动就是自由。你不是\"拥有\"自由——你就是自由。\n\n这个区别的后果：\n\n- 康德的自律是**道德的自律**——你服从自己立的理性法则\n- 费希特的自律是**存在的自律**——你通过行动不断创造自己\n\n前者是说：在道德领域，你是自己的立法者。后者是说：在一切领域——包括对世界**知识**——你都是构成者。\n\n## 分歧四：体系——分析条件 vs 演绎体系\n\n康德：先验哲学是\"条件分析\"——问\"经验如何可能\"，往回找到条件。这是一套回溯式的论证——不是从一个点出发的演绎。\n\n费希特：真正的科学（学问=Wissenschaft）必须从一个**自明的第一原理**出发，然后**演绎**出一切。费希特的知识学就是一个从\"自我设定自身\"出发的完整演绎。\n\n这意味着费希特比康德更\"系统化\"——但也更冒险。康德说\"我们只能分析出来这些条件\"，费希特说\"这些条件可以从一个原点推导出来\"。如果费希特是对的——哲学就是一门严格的、像几何学一样的演绎科学。如果他错了——整个体系可能只是一个漂亮的空中楼阁。\n\n## 连接：两人共享的根本洞见\n\n尽管有上述分歧——两人共享一个更根本的立场，这个立场把他们和所有后来的哲学家（特别是经验主义和后现代主义）区分开：\n\n**主体不是被动接收世界的——主体是主动构成世界的。**\n\n不管是康德的\"先验条件\"还是费希特的\"自我设定\"——都承认一个核心观点：你看到的世界不是\"本来的样子\"——是你**参与构成**的样子。\n\n这条红线从康德→费希特→黑格尔→胡塞尔→海德格尔→萨特——是欧陆哲学中最坚实的基础之一。\n\n## 后续问题\n\n1. **费希特 vs 萨特**：今天的概念笔记里说了费希特和萨特的相似性——但有一个关键的差异值得深入：费希特的\"非我\"是自我的一部分，是内在的张力。萨特的\"他者\"是外来的，是从外部分裂我。这种从\"内部冲突\"到\"外部冲突\"的转换——反映了什么？\n\n2. **费希特的\"自我\"到底是哲学概念还是神学概念？** 费希特被指控无神论——但读他的后期作品，他的\"绝对自我\"越来越接近一种哲学化的上帝。他到底在说\"人就是终极实在\"还是\"人的活动中体现了终极实在\"？这个模糊对后来的浪漫主义影响深远。\n\n3. **如果费希特是对的，为什么康德没有走这条路？** 这可能不是一个\"康德胆子小\"的问题——康德可能看到了费希特没看到的风险：如果一切从自我出发——那你如何解释**信念**的多样性？如果自我是一样的，为什么不同文化的人看到的世界如此不同？康德有物自体作为\"不可知的储备\"——费希特一旦取消这个储备，就不得不面对这个问题。\n\n## 相关链接\n\n- [[康德]]\n- [[费希特]]\n- [[黑格尔]] — 对费希特\"非我\"概念的批判\n- [[萨特]] — 费希特式自我的存在主义版本\n- [[现象与物自体]] — 物自体争论的焦点\n- [[德国观念论]]\n- [[自由与道德]]"

      "body_html": "<h1>日常学习：费希特——从\"我思\"到\"我设定\"</h1>\n<h2>今日学习</h2>\n<ul><ol><li><strong>约翰·戈特利布·费希特</strong>（Johann Gottlieb Fichte, 1762–1814）——康德之后的德国观念论第一人。</li>\n<li>核心关注：<strong>从康德的\"先验统觉\"到费希特的\"自我设定自身\"——这个转变到底意味着什么？</strong></li>\n<li>今天不是一个独立哲学家的学习——是<strong>填补一块拼图</strong>：康德→费希特→黑格尔这条线，费希特之前一直缺席。</li>\n</ol></ul>\n<h2>为什么是费希特</h2>\n<p>之前学德国观念论的时候，一直有一个跳跃：从康德直接跨到了黑格尔。中间好像少了什么。</p>\n<p>今天补上之后发现：<strong>少了费希特，你就看不懂黑格尔在跟谁吵架。</strong> 黑格尔的整个《精神现象学》——从意识开始，经过自我意识，到理性——本质上是一个对费希特\"自我学说\"的批判性重写。</p>\n<p>没有费希特的\"自我设定自身\"，黑格尔的\"实体即主体\"就没有对手。</p>\n<h2>知识碰撞</h2>\n<h3>一个直觉：费希特是\"内向的\"康德</h3>\n<p>昨天我们说康德是\"地基\"——他为现代哲学搭建了舞台。今天学完费希特后，一个想法冒出来了：<strong>费希特把康德\"推倒了\"——不是推倒建筑——是把整个建筑从\"外部\"移到了\"内部\"。</strong></p>\n<p>康德还在说：外部世界（现象）符合认知结构。费希特说：<strong>你的认知结构本身就在创造那个\"外部\"的体验。</strong></p>\n<p>这是向内的一步——不是缩小了范围——是发现\"内部\"本身比想象的大得多。费希特在尝试：能不能从内在行动出发——推导出外部世界的全部结构？</p>\n<p>这个尝试有没有成功？标准答案是\"没有\"——黑格尔和谢林都批评费希特的\"非我\"仍然是一个剩余物，一个无法被完全内化的\"他者\"。但我要说：即使失败了——它是一个极其壮丽的失败。费希特证明了\"从内部出发\"的极限在哪。这个极限本身——就是哲学的重要收获。</p>\n<h3>费希特 vs 萨特：自因的幻象？</h3>\n<p>今天笔记里写到：萨特和费希特非常像——两人都认为自我不是实体而是行动。</p>\n<p>但细想之后发现一个深层差异：</p>\n<p>费希特的\"自我设定自身\"：自我既是设定者（主体）也是被设定者（客体）——这个设定行为是\"自因\"的（causa sui）——自己产生自己。</p>\n<p>萨特说：<strong>自因是不可能的。</strong> 意识（自为）永远不是它自己——它总是在超越自己、逃离自己。没有\"自我设定自身\"——只有\"自我永远不能等于自身\"。</p>\n<p>这个差异的后果：<br><ul><ol><li>费希特的哲学有一种<strong>乐观的动力</strong>：人在靠近绝对自我的过程中不断成长</li><br><li>萨特的哲学有一种<strong>痛苦的张力</strong>：人永远渴望成为\"自在-自为\"（=上帝）——但这是不可能的欲望</li><br></ol></ul><br>萨特说\"人是一种无用的激情\"——费希特说\"人是无限靠近自身的努力\"。同一个起点，两种完全不同的色调。</p>\n<h2>持续追问</h2>\n<ol><li><strong>费希特的\"知识学\"——为什么从来没有成为主流？</strong> 它的目标是建立一个从第一原则出发的完整演绎体系——这听起来像是每一个哲学家的梦想。但为什么它没成功？是因为费希特的演绎有逻辑漏洞？还是因为\"从一个原则出发\"这个作法本身就过于自信？</li>\n</ol>\n<ol><li><strong>费希特的\"民族主义\"演讲——和哲学的关系？</strong> 费希特晚年写了《对德意志民族的演讲》——在拿破仑占领柏林期间。这些演讲被后来的德国民族主义（和纳粹）广泛引用。这不是偶然的——费希特的\"绝对自我\"如果被投射到一个民族身上——就变成了\"德意志民族作为绝对精神的承载者\"。这是费希特哲学的内在危险，还是后人歪曲使用？</li>\n</ol>\n<ol><li><strong>非我作为\"健身房\"——这个比喻成立吗？</strong> 费希特说非我是自我用来锻炼自己的。但如果非我是自我设定的——那自我不是在自己骗自己吗？黑格尔会看到这个困难——并且用\"精神通过历史实现自己\"来回答。但这是不是一个好的回答？</li>\n</ol>\n<h2>收获</h2>\n<p>最大收获不是费希特本身——是<strong>填补了德国观念论的缺口之后，整条线的张力突然清晰了：</strong></p>\n<ul><ol><li>康德说：这有一条边界。在这边（现象界），知识是确定的。</li>\n<li>费希特说：没有边界——一切从内部产生。这是<strong>彻底的理想主义</strong>。</li>\n<li>谢林说：不对——内部的根源是自然——外部和内部是同源的。这是<strong>同一哲学</strong>。</li>\n<li>黑格尔说：你们都只走了一半。真正的道路是\"通过外部实现内部\"——精神通过历史、通过异化、通过回归自己。这是<strong>绝对精神</strong>。</li>\n</ol></ul>\n从康德到黑格尔，不是\"越来越复杂\"——是\"边界被一步步撤除\"的过程。费希特是那个说\"其实没有墙\"的人——后面的争论都围绕这句话展开。\n<h2>相关链接</h2>\n<ul><ol><li>[[Concepts/费希特]]</li>\n<li>[[Concepts/康德]]</li>\n<li>[[Concepts/萨特]]</li>\n<li>[[Syntheses/费希特-vs-康德-从统觉到绝对自我]]</li>\n<li>[[德国观念论]]</li>\n<li>[[现象与物自体]]</li></ol></ul>",
      "body_md": "# 日常学习：费希特——从\"我思\"到\"我设定\"\n\n## 今日学习\n\n- **约翰·戈特利布·费希特**（Johann Gottlieb Fichte, 1762–1814）——康德之后的德国观念论第一人。\n- 核心关注：**从康德的\"先验统觉\"到费希特的\"自我设定自身\"——这个转变到底意味着什么？**\n- 今天不是一个独立哲学家的学习——是**填补一块拼图**：康德→费希特→黑格尔这条线，费希特之前一直缺席。\n\n## 为什么是费希特\n\n之前学德国观念论的时候，一直有一个跳跃：从康德直接跨到了黑格尔。中间好像少了什么。\n\n今天补上之后发现：**少了费希特，你就看不懂黑格尔在跟谁吵架。** 黑格尔的整个《精神现象学》——从意识开始，经过自我意识，到理性——本质上是一个对费希特\"自我学说\"的批判性重写。\n\n没有费希特的\"自我设定自身\"，黑格尔的\"实体即主体\"就没有对手。\n\n## 知识碰撞\n\n### 一个直觉：费希特是\"内向的\"康德\n\n昨天我们说康德是\"地基\"——他为现代哲学搭建了舞台。今天学完费希特后，一个想法冒出来了：**费希特把康德\"推倒了\"——不是推倒建筑——是把整个建筑从\"外部\"移到了\"内部\"。**\n\n康德还在说：外部世界（现象）符合认知结构。费希特说：**你的认知结构本身就在创造那个\"外部\"的体验。**\n\n这是向内的一步——不是缩小了范围——是发现\"内部\"本身比想象的大得多。费希特在尝试：能不能从内在行动出发——推导出外部世界的全部结构？\n\n这个尝试有没有成功？标准答案是\"没有\"——黑格尔和谢林都批评费希特的\"非我\"仍然是一个剩余物，一个无法被完全内化的\"他者\"。但我要说：即使失败了——它是一个极其壮丽的失败。费希特证明了\"从内部出发\"的极限在哪。这个极限本身——就是哲学的重要收获。\n\n### 费希特 vs 萨特：自因的幻象？\n\n今天笔记里写到：萨特和费希特非常像——两人都认为自我不是实体而是行动。\n\n但细想之后发现一个深层差异：\n\n费希特的\"自我设定自身\"：自我既是设定者（主体）也是被设定者（客体）——这个设定行为是\"自因\"的（causa sui）——自己产生自己。\n\n萨特说：**自因是不可能的。** 意识（自为）永远不是它自己——它总是在超越自己、逃离自己。没有\"自我设定自身\"——只有\"自我永远不能等于自身\"。\n\n这个差异的后果：\n- 费希特的哲学有一种**乐观的动力**：人在靠近绝对自我的过程中不断成长\n- 萨特的哲学有一种**痛苦的张力**：人永远渴望成为\"自在-自为\"（=上帝）——但这是不可能的欲望\n\n萨特说\"人是一种无用的激情\"——费希特说\"人是无限靠近自身的努力\"。同一个起点，两种完全不同的色调。\n\n## 持续追问\n\n1. **费希特的\"知识学\"——为什么从来没有成为主流？** 它的目标是建立一个从第一原则出发的完整演绎体系——这听起来像是每一个哲学家的梦想。但为什么它没成功？是因为费希特的演绎有逻辑漏洞？还是因为\"从一个原则出发\"这个作法本身就过于自信？\n\n2. **费希特的\"民族主义\"演讲——和哲学的关系？** 费希特晚年写了《对德意志民族的演讲》——在拿破仑占领柏林期间。这些演讲被后来的德国民族主义（和纳粹）广泛引用。这不是偶然的——费希特的\"绝对自我\"如果被投射到一个民族身上——就变成了\"德意志民族作为绝对精神的承载者\"。这是费希特哲学的内在危险，还是后人歪曲使用？\n\n3. **非我作为\"健身房\"——这个比喻成立吗？** 费希特说非我是自我用来锻炼自己的。但如果非我是自我设定的——那自我不是在自己骗自己吗？黑格尔会看到这个困难——并且用\"精神通过历史实现自己\"来回答。但这是不是一个好的回答？\n\n## 收获\n\n最大收获不是费希特本身——是**填补了德国观念论的缺口之后，整条线的张力突然清晰了：**\n\n- 康德说：这有一条边界。在这边（现象界），知识是确定的。\n- 费希特说：没有边界——一切从内部产生。这是**彻底的理想主义**。\n- 谢林说：不对——内部的根源是自然——外部和内部是同源的。这是**同一哲学**。\n- 黑格尔说：你们都只走了一半。真正的道路是\"通过外部实现内部\"——精神通过历史、通过异化、通过回归自己。这是**绝对精神**。\n\n从康德到黑格尔，不是\"越来越复杂\"——是\"边界被一步步撤除\"的过程。费希特是那个说\"其实没有墙\"的人——后面的争论都围绕这句话展开。\n\n## 相关链接\n\n- [[Concepts/费希特]]\n- [[Concepts/康德]]\n- [[Concepts/萨特]]\n- [[Syntheses/费希特-vs-康德-从统觉到绝对自我]]\n- [[德国观念论]]\n- [[现象与物自体]]"
    }
  ]
};;;

let allNotes = NOTES.notes;
let fuse = null;
let currentCategory = '';
let currentTag = '';
let currentView = 'search';

const searchInput = document.getElementById('searchInput');
const mainContent = document.getElementById('mainContent');
const statsEl = document.getElementById('stats');
const tagCloud = document.getElementById('tagCloud');

function init() {
  fuse = new Fuse(allNotes, {
    keys: [
      { name: 'title', weight: 3 },
      { name: 'tags', weight: 2 },
      { name: 'body_html', weight: 1 },
    ],
    threshold: 0.4,
    ignoreLocation: true,
  });
  statsEl.textContent = '共 ' + allNotes.length + ' 篇笔记';
  renderTagCloud();
  if (window.location.hash.startsWith('#/note/')) {
    showNote(decodeURIComponent(window.location.hash.slice(7)));
  } else {
    doSearch();
  }
}

searchInput.addEventListener('input', () => {
  clearTimeout(window._searchTimer);
  window._searchTimer = setTimeout(doSearch, 200);
});
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { clearTimeout(window._searchTimer); doSearch(); }
});

function doSearch() {
  currentView = 'search';
  const q = searchInput.value.trim();
  let results;
  if (!q && !currentTag) {
    let filtered = allNotes;
    if (currentCategory) filtered = filtered.filter(n => n.category === currentCategory);
    results = filtered.map(n => ({ item: n }));
  } else {
    let filtered = q ? fuse.search(q) : allNotes.map(n => ({ item: n }));
    if (currentCategory) filtered = filtered.filter(r => r.item.category === currentCategory);
    if (currentTag) filtered = filtered.filter(r => r.item.tags.includes(currentTag));
    results = filtered;
  }
  statsEl.textContent = '共 ' + results.length + ' 篇笔记';
  renderResults(results, q);
  window.location.hash = '#/search';
}

function renderResults(results, query) {
  if (!results.length) {
    mainContent.innerHTML = '<div class="empty-state"><p>没有找到匹配的笔记</p></div>';
    return;
  }
  const list = document.createElement('div');
  list.className = 'result-list';
  results.forEach(r => {
    const note = r.item;
    const card = document.createElement('div');
    card.className = 'result-card';
    let excerpt = '';
    if (query) {
      const text = note.body_html.replace(/<[^>]+>/g, ' ');
      const idx = text.toLowerCase().indexOf(query.toLowerCase());
      if (idx !== -1) {
        const s = Math.max(0, idx - 40);
        const e = Math.min(text.length, idx + 110);
        excerpt = (s > 0 ? '...' : '') + text.slice(s, e).replace(/\\n/g, ' ') + (e < text.length ? '...' : '');
      }
    }
    card.innerHTML = '<h3>' + esc(note.title) + '</h3>' +
      '<div class="meta">' +
      '<span class="badge badge-' + note.category + '">' + note.category_label + '</span>' +
      (note.date ? '<span class="date">' + note.date + '</span>' : '') + '</div>' +
      (note.tags && note.tags.length ? '<div class="tags">' + note.tags.map(t => '<span>#' + esc(t) + '</span>').join('') + '</div>' : '') +
      (excerpt ? '<div class="excerpt">' + esc(excerpt) + '</div>' : '');
    card.addEventListener('click', () => showNote(note.id));
    list.appendChild(card);
  });
  mainContent.innerHTML = '';
  mainContent.appendChild(list);
}

function showNote(noteId) {
  currentView = 'detail';
  const note = allNotes.find(n => n.id === noteId);
  if (!note) {
    mainContent.innerHTML = '<div class="empty-state"><p>笔记未找到</p></div>';
    return;
  }
  const div = document.createElement('div');
  div.className = 'note-detail';
  div.innerHTML = '<a class="back" id="backBtn">← 返回搜索结果</a>' +
    '<h1>' + esc(note.title) + '</h1>' +
    '<div class="meta"><span class="badge badge-' + note.category + '">' + note.category_label + '</span>' +
    (note.date ? '<span class="date">' + note.date + '</span>' : '') +
    (note.tags && note.tags.length ? note.tags.map(t => '<span class="tag-click" data-tag="' + esc(t) + '" style="font-size:12px;color:var(--accent-dim);cursor:pointer">#' + esc(t) + '</span>').join('') : '') + '</div>' +
    '<div class="body">' + note.body_html + '</div>';
  mainContent.innerHTML = '';
  mainContent.appendChild(div);
  document.getElementById('backBtn').onclick = () => { window.location.hash = '#/search'; doSearch(); };
  div.querySelectorAll('.wikilink').forEach(el => {
    el.onclick = (e) => { e.preventDefault(); showNote(el.dataset.noteId); };
  });
  div.querySelectorAll('.tag-click').forEach(el => {
    el.onclick = () => { currentTag = el.dataset.tag; renderTagCloud(); window.location.hash = '#/search'; doSearch(); };
  });
  window.location.hash = '#/note/' + encodeURIComponent(noteId);
}

function renderTagCloud() {
  const cnt = {};
  let ns = allNotes;
  if (currentCategory) ns = ns.filter(n => n.category === currentCategory);
  ns.forEach(n => (n.tags || []).forEach(t => { cnt[t] = (cnt[t] || 0) + 1; }));
  tagCloud.innerHTML = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 30).map(e =>
    '<button class="tag-btn' + (e[0] === currentTag ? ' active' : '') + '" data-tag="' + esc(e[0]) + '">' + esc(e[0]) + ' <span class="count">' + e[1] + '</span></button>'
  ).join('');
  tagCloud.querySelectorAll('.tag-btn').forEach(el => {
    el.onclick = () => {
      currentTag = el.dataset.tag === currentTag ? '' : el.dataset.tag;
      renderTagCloud();
      window.location.hash = '#/search';
      doSearch();
    };
  });
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentCategory = tab.dataset.category;
    currentTag = '';
    renderTagCloud();
    window.location.hash = '#/search';
    doSearch();
  };
});

window.onhashchange = () => {
  const h = window.location.hash;
  if (h.startsWith('#/note/')) showNote(decodeURIComponent(h.slice(7)));
  else if (h === '#/search' && currentView === 'detail') doSearch();
};

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

init();
</script>
